name: Docker Build & Push

on:
  push:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Сборка и отправка образа
        run: |
          # Собираем образ. Тег (метка) версии привязываем к хешу коммита (github.sha)
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-ci-cd-app:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/my-ci-cd-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/my-ci-cd-app:latest
          
          # Отправляем в Docker Hub
          docker push ${{ secrets.DOCKER_USERNAME }}/my-ci-cd-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-ci-cd-app:latest
