name: Full Pipeline

on:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install flake8
      - name: Проверка кода (lint)
        run: flake8 app/ tests/ --max-line-length=120

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Юнит-тесты
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка артефакта
        run: |
          mkdir dist
          tar -czf dist/app.tar.gz app/
      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/app.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Скачать артефакт
        uses: actions/download-artifact@v4
        with:
          name: app-build
      - name: Развертывание
        run: echo "Deploying app.tar.gz to production..."
