name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Сборка артефакта
        run: |
          mkdir dist
          tar -czf dist/my-app-${{ github.ref_name }}.tar.gz app/

      - name: Создание релиза на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true  # <--- ВОТ МАГИЯ! GitHub сам соберет changelog из коммитов
          files: dist/*.tar.gz
